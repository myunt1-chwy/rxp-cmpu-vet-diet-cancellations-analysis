[project]
name = "rxp-analysis-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "click>=8.5.0",
    "duckdb>=1.5.5",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml",
    "scipy>=1.18.1",
    "snowflake-connector-python[secure-local-storage]>=4.7.5",
    "sqlparse>=0.6.0",
    "statsmodels>=0.15.0",
    "vl-convert-python>=1.9.0.post1",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "sqlfluff>=4.5.0",
    "tomlkit>=0.13.3",
]

[tool.ruff]
line-length = 79
target-version = "py312"
force-exclude = true
extend-exclude = ["playground", "**/src/autogenerated", ".agents", ".codex"]

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "tests"]
